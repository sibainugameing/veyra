<!doctype html><html><head><meta charset="utf-8"><title>Veyra Studio</title>
<style>
:root{--bg:#0d0f17;--pn:#151826;--tx:#e8eaf3;--mu:#8a90a8;--bd:#272b3d;--ac:#8c74ff;--cd:#1c2033}
*{box-sizing:border-box}html,body,#root{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:13px/1.4 system-ui,"Hiragino Sans",sans-serif;overflow:hidden}
.app{display:grid;height:100%;grid-template-columns:190px 1fr 480px;grid-template-rows:38px 1fr 200px 26px;gap:1px;background:var(--bd)}
.app>*{background:var(--pn);min-height:0;min-width:0;overflow:hidden}
.top{grid-column:1/4;display:flex;align-items:center;gap:10px;padding:0 12px}.top b{color:var(--ac)}.sp{flex:1}
button{background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:4px 10px;font:inherit;cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}
h4{margin:0;padding:8px 10px 4px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.files div{padding:3px 12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.files div:hover{background:var(--cd)}.files div.on{color:var(--ac);background:var(--cd)}
.right{display:flex;flex-direction:column}.pv{padding:8px}.pvbox{position:relative;width:100%;background:#000;border-radius:6px;overflow:hidden}
.pvbox iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0}
.ctl{display:flex;gap:8px;align-items:center;padding:4px 8px}.ctl input{flex:1}
.insp{padding:4px 12px;overflow:auto;flex:1}.insp dl{display:grid;grid-template-columns:70px 1fr;gap:3px 8px;margin:6px 0}.insp dt{color:var(--mu)}.insp dd{margin:0}
.tl{grid-column:1/4;overflow:auto;position:relative}.tlin{position:relative;margin:0 10px 8px 130px}
.row{position:relative;height:20px;margin-bottom:3px;background:var(--cd);border-radius:3px}.lab{position:absolute;right:100%;margin-right:8px;width:120px;text-align:right;color:var(--mu);font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:20px}
.clip{position:absolute;top:2px;height:16px;border-radius:3px;cursor:pointer;font-size:10px;padding:0 4px;overflow:hidden;white-space:nowrap;line-height:16px;opacity:.8}
.clip.sel{opacity:1;outline:2px solid #fff}.k-sequence{background:#6b4cff}.k-video{background:#0e9f6e}.k-audio{background:#d97706}.k-image{background:#db2777}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#ef4444;pointer-events:none;z-index:3}
.out{grid-column:1/4;display:flex;align-items:center;gap:12px;padding:0 12px;color:var(--mu);font-size:12px}.err{color:#f87171}
.bar{width:140px;height:6px;background:var(--cd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
#ed{height:calc(100% - 28px)}
</style></head><body><div id="root"></div>
<script src="vs/loader.js"></script>
<script>require.config({paths:{vs:'vs'}});window.monacoReady=new Promise(r=>require(['vs/editor/editor.main'],()=>r(window.monaco)));</script>
<script src="ui.js"></script></body></html>
