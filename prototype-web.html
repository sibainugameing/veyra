<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>Veyra Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f8;--pn:#fff;--tx:#1a1d29;--mu:#6b7186;--bd:#d9dce6;--ac:#6b4cff;--cd:#eef0f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f17;--pn:#151826;--tx:#e8eaf3;--mu:#8a90a8;--bd:#272b3d;--ac:#8c74ff;--cd:#1c2033}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.4 system-ui,"Hiragino Sans",sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--pn);flex-wrap:wrap}
header b{font-size:15px;color:var(--ac)}header span{color:var(--mu);font-size:12px}
button{background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit}
button:hover{border-color:var(--ac)}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
main{flex:1;display:grid;grid-template-columns:minmax(220px,1fr) minmax(260px,1.4fr) minmax(200px,.8fr);grid-template-rows:1fr 190px;gap:1px;background:var(--bd);min-height:0}
section{background:var(--pn);min-height:0;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
h4{margin:0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
textarea{flex:1;width:100%;resize:none;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px;font:12px/1.5 ui-monospace,Menlo,monospace;min-height:120px;tab-size:2}
canvas{width:100%;max-height:100%;background:#000;border-radius:6px;object-fit:contain}
.row{display:flex;gap:6px;align-items:center}input[type=range]{flex:1}
.tl{grid-column:1/3;overflow:auto}.tr{position:relative;height:22px;background:var(--cd);border-radius:4px;margin-bottom:3px}
.clip{position:absolute;top:2px;height:18px;background:var(--ac);border-radius:3px;color:#fff;font-size:10px;padding:1px 5px;overflow:hidden;white-space:nowrap;cursor:pointer;opacity:.75}
.clip.sel{opacity:1;outline:2px solid var(--tx)}.ph{position:absolute;top:0;bottom:0;width:2px;background:#ef4444;pointer-events:none}
.tw{position:relative}label{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center;color:var(--mu)}
input[type=text],input[type=number],input[type=color]{width:100%;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:3px 6px;font:inherit}
pre{margin:0;font:11px ui-monospace,monospace;white-space:pre-wrap;color:var(--mu);max-height:90px;overflow:auto}
.err{color:#ef4444}
@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:auto;overflow:auto}.tl{grid-column:auto}section{min-height:240px}}
</style></head><body>
<header><b>Veyra Studio</b><span>Code-first / AI-native · プロトタイプ</span><span style="flex:1"></span>
<button id="un">↶ Undo</button><button id="re">↷ Redo</button><button id="rec" class="p">● WebM書き出し</button></header>
<main>
<section><h4>Code Editor (JS · 差し替え可)</h4><textarea id="code" spellcheck="false"></textarea><pre id="err" class="err"></pre></section>
<section><h4>Preview</h4><canvas id="cv"></canvas>
<div class="row"><button id="pl">▶</button><input type="range" id="sc" min="0" max="0" value="0"><span id="fl">0/0</span></div>
<video id="vid" controls style="display:none;width:100%;border-radius:6px"></video></section>
<section><h4>Inspector</h4><div id="insp" style="display:flex;flex-direction:column;gap:5px"><span style="color:var(--mu)">タイムラインのクリップを選択</span></div>
<h4>Command API / CLI</h4><textarea id="cmd" style="min-height:60px;flex:none" spellcheck="false">{"cmd":"clip.move","id":"sub","from":60}</textarea>
<div class="row"><button id="run">実行</button><button onclick="cmd.value='{&quot;cmd&quot;:&quot;project.inspect&quot;}'">inspect</button></div><pre id="out"></pre></section>
<section class="tl"><h4>Timeline</h4><div class="tw" id="tw"></div></section>
</main>
<script>
const SAMPLE=`const {interpolate:i, spring, text, rect, circle} = V;
return {
  width:1280, height:720, fps:30, duration:150, bg:'#0b1020',
  layers:[
    circle({id:'orb', dur:150, x:f=>spring(f,{from:200,to:1000,dur:60}), y:560, r:f=>40+10*Math.sin(f/8), color:'#7c5cff'}),
    rect({id:'bar', from:15, dur:135, x:140, y:470, w:f=>i(f,[0,40],[0,1000]), h:8, color:'#38bdf8'}),
    text({id:'title', dur:150, text:'Welcome to Veyra', x:640, y:300, size:84, color:'#ffffff', opacity:f=>i(f,[0,30],[0,1])}),
    text({id:'sub', from:45, dur:105, text:'Code · GUI · AI', x:640, y:400, size:36, color:'#9fb3ff', opacity:f=>i(f,[0,20],[0,1])})
  ]};`;
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const V={
 interpolate(f,inp,out,e){let n=inp.length;if(f<=inp[0])return out[0];if(f>=inp[n-1])return out[n-1];
  for(let k=1;k<n;k++)if(f<=inp[k]){let t=(f-inp[k-1])/(inp[k]-inp[k-1]);return out[k-1]+(out[k]-out[k-1])*(e===false?t:ease(t));}},
 spring(f,{from=0,to=1,dur=30}){const t=Math.min(1,Math.max(0,f/dur));const s=1-Math.exp(-6*t)*Math.cos(9*t);return from+(to-from)*s;},
 text:p=>({type:'text',x:0,y:0,size:48,color:'#fff',opacity:1,text:'',from:0,...p}),
 rect:p=>({type:'rect',x:0,y:0,w:100,h:100,color:'#fff',opacity:1,from:0,...p}),
 circle:p=>({type:'circle',x:0,y:0,r:50,color:'#fff',opacity:1,from:0,...p})};
const FIELDS={text:['from','dur','text','x','y','size','color','opacity'],rect:['from','dur','x','y','w','h','color','opacity'],circle:['from','dur','x','y','r','color','opacity']};
let comp=null,ov={},hist=[],hp=-1,sel=null,frame=0,playing=false,timer=null;
const snap=()=>JSON.stringify(ov);
function commit(){hist=hist.slice(0,hp+1);hist.push(snap());hp=hist.length-1;refresh();}
function undo(d){const n=hp+d;if(n<0||n>=hist.length)return false;hp=n;ov=JSON.parse(hist[hp]);refresh();return true;}
function val(l,k,f){const o=ov[l.id]&&ov[l.id][k];let v=o!==undefined?o:l[k];if(typeof v==='function')v=v(f);return v;}
function build(){try{comp=new Function('V',$('code').value)(V);$('err').textContent='';
 const d=comp.duration;$('sc').max=d-1;cv.width=comp.width;cv.height=comp.height;
 comp.layers.forEach(l=>{l.dur=l.dur??d});}catch(e){$('err').textContent=String(e);}refresh();}
function render(){if(!comp)return;const f=frame;ctx.fillStyle=comp.bg||'#000';ctx.fillRect(0,0,cv.width,cv.height);
 for(const l of comp.layers){const from=val(l,'from',0),dur=val(l,'dur',0);if(f<from||f>=from+dur)continue;const lf=f-from;
  ctx.globalAlpha=Math.max(0,Math.min(1,val(l,'opacity',lf)));ctx.fillStyle=val(l,'color',lf);
  const x=val(l,'x',lf),y=val(l,'y',lf);
  if(l.type==='text'){ctx.font=`600 ${val(l,'size',lf)}px system-ui,"Hiragino Sans",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(val(l,'text',lf),x,y);}
  else if(l.type==='rect')ctx.fillRect(x,y,val(l,'w',lf),val(l,'h',lf));
  else{ctx.beginPath();ctx.arc(x,y,Math.max(0,val(l,'r',lf)),0,7);ctx.fill();}}
 ctx.globalAlpha=1;$('sc').value=f;$('fl').textContent=`${f}/${comp.duration-1} · ${(f/comp.fps).toFixed(2)}s`;
 document.querySelector('.ph')&&(document.querySelector('.ph').style.left=(f/comp.duration*100)+'%');}
function tl(){const tw=$('tw');tw.innerHTML='';if(!comp)return;
 comp.layers.forEach(l=>{const r=document.createElement('div');r.className='tr';const c=document.createElement('div');
  c.className='clip'+(sel===l.id?' sel':'');const a=val(l,'from',0),d=val(l,'dur',0);
  c.style.left=a/comp.duration*100+'%';c.style.width=d/comp.duration*100+'%';c.textContent=l.id+' ('+l.type+')';
  c.onclick=()=>{sel=l.id;tl();insp();};r.appendChild(c);tw.appendChild(r);});
 const ph=document.createElement('div');ph.className='ph';tw.appendChild(ph);
 tw.onclick=e=>{if(e.target.closest('.clip'))return;const b=tw.getBoundingClientRect();frame=Math.max(0,Math.min(comp.duration-1,Math.floor((e.clientX-b.left)/b.width*comp.duration)));render();};}
function insp(){const el=$('insp');const l=comp&&comp.layers.find(x=>x.id===sel);if(!l){el.innerHTML='<span style="color:var(--mu)">タイムラインのクリップを選択</span>';return;}
 el.innerHTML='<b>'+l.id+'</b>';FIELDS[l.type].forEach(k=>{const lab=document.createElement('label');lab.textContent=k;
  const cur=val(l,k,Math.max(0,frame-val(l,'from',0)));const inp=document.createElement('input');
  inp.type=k==='color'?'color':k==='text'?'text':'number';if(k==='opacity')inp.step=.1;inp.value=typeof cur==='number'?Math.round(cur*100)/100:cur;
  inp.onchange=()=>{(ov[l.id]=ov[l.id]||{})[k]=inp.type==='number'?+inp.value:inp.value;commit();};lab.appendChild(inp);el.appendChild(lab);});}
function refresh(){tl();insp();render();}
function api(c){const L=id=>comp.layers.find(l=>l.id===id);const need=id=>{if(!L(id))throw Error('unknown id: '+id);};
 switch(c.cmd){
  case'project.inspect':return{width:comp.width,height:comp.height,fps:comp.fps,duration:comp.duration,layers:comp.layers.map(l=>({id:l.id,type:l.type,from:val(l,'from',0),dur:val(l,'dur',0)}))};
  case'timeline.get':return comp.layers.map(l=>[l.id,val(l,'from',0),val(l,'from',0)+val(l,'dur',0)]);
  case'clip.move':need(c.id);if(!(c.from>=0&&c.from<comp.duration))throw Error('from out of range');(ov[c.id]=ov[c.id]||{}).from=c.from;commit();return'ok';
  case'clip.trim':need(c.id);if(!(c.dur>0))throw Error('dur must be > 0');(ov[c.id]=ov[c.id]||{}).dur=c.dur;commit();return'ok';
  case'clip.update':need(c.id);Object.assign(ov[c.id]=ov[c.id]||{},c.props);commit();return'ok';
  case'preview.render_frame':frame=c.frame|0;render();return cv.toDataURL('image/jpeg',.4).slice(0,60)+'…';
  case'history.undo':return undo(-1)?'ok':'nothing';case'history.redo':return undo(1)?'ok':'nothing';
  default:throw Error('unknown cmd');}}
window.veyra={api};
$('run').onclick=()=>{try{$('out').className='';$('out').textContent=JSON.stringify(api(JSON.parse($('cmd').value)),null,1);}catch(e){$('out').className='err';$('out').textContent=String(e.message);}};
$('un').onclick=()=>undo(-1);$('re').onclick=()=>undo(1);
$('sc').oninput=e=>{frame=+e.target.value;render();};
function play(on){playing=on;$('pl').textContent=on?'⏸':'▶';clearInterval(timer);if(on)timer=setInterval(()=>{frame=(frame+1)%comp.duration;render();},1000/comp.fps);}
$('pl').onclick=()=>play(!playing);
$('code').value=SAMPLE;$('code').oninput=()=>{clearTimeout(window.__t);window.__t=setTimeout(build,300);};
$('rec').onclick=()=>{if(typeof MediaRecorder==='undefined'){alert('MediaRecorder非対応');return;}play(false);frame=0;render();
 const ch=[],mr=new MediaRecorder(cv.captureStream(comp.fps),{mimeType:'video/webm'});mr.ondataavailable=e=>ch.push(e.data);
 mr.onstop=()=>{const v=$('vid');v.src=URL.createObjectURL(new Blob(ch,{type:'video/webm'}));v.style.display='block';$('rec').disabled=false;$('rec').textContent='● WebM書き出し';};
 mr.start();$('rec').disabled=true;$('rec').textContent='書き出し中…';
 const t=setInterval(()=>{frame++;if(frame>=comp.duration){clearInterval(t);frame=comp.duration-1;render();mr.stop();}else render();},1000/comp.fps);};
build();hist=[snap()];hp=0;
</script></body></html>
