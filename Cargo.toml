[workspace]
members = ["crates/*"]
resolver = "2"
[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
veyra-project = { path = "crates/veyra-project" }
veyra-timeline = { path = "crates/veyra-timeline" }
veyra-media = { path = "crates/veyra-media" }
veyra-render = { path = "crates/veyra-render" }
veyra-core = { path = "crates/veyra-core" }
veyra-source = { path = "crates/veyra-source" }
veyra-history = { path = "crates/veyra-history" }
